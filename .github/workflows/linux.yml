name: Build Linux .deb
on:
  workflow_dispatch:
  push:
    paths:
      - 'linux/**'
      - 'app/src/main/java/com/foxssh/vpn/core/**'
      - '.github/workflows/linux.yml'

jobs:
  deb:
    runs-on: ubuntu-22.04      # glibc 2.35 → روی Ubuntu 22.04 و بالاتر اجرا می‌شود
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Build tun2socks (hev-socks5-tunnel)
        run: |
          git clone --recursive --depth 1 --branch 2.20.0 https://github.com/heiher/hev-socks5-tunnel /tmp/hev
          make -C /tmp/hev -j"$(nproc)"
      - name: Fetch JSch
        run: curl -fsSL -o /tmp/jsch.jar https://repo1.maven.org/maven2/com/github/mwiede/jsch/0.2.19/jsch-0.2.19.jar
      - name: Build .deb
        run: JSCH_JAR=/tmp/jsch.jar HEV_BIN=/tmp/hev/bin/hev-socks5-tunnel ./linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: foxssh-deb
          path: linux/build/*.deb
