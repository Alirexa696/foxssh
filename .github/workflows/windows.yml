name: Build Windows installer
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - 'linux/src/**'
      - 'linux/assets/**'
      - 'app/src/main/java/com/foxssh/vpn/core/**'
      - '.github/workflows/windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    env:
      FOX_VERSION: '1.1.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ── tun2socks: اول فایل آمادهٔ ریلیز، اگر نبود از سورس با clang
      - name: Get hev-socks5-tunnel (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/tools | Out-Null
          $ok = $false
          try {
            Invoke-WebRequest -Uri 'https://github.com/heiher/hev-socks5-tunnel/releases/download/2.20.0/hev-socks5-tunnel-win64.zip' -OutFile hev.zip
            Expand-Archive hev.zip -DestinationPath hev-rel -Force
            $exe = Get-ChildItem hev-rel -Recurse -Filter 'hev-socks5-tunnel.exe' | Select-Object -First 1
            if ($exe) { Copy-Item $exe.FullName build/tools/; $ok = $true
              $dll = Get-ChildItem hev-rel -Recurse -Filter 'wintun.dll' | Select-Object -First 1
              if ($dll) { Copy-Item $dll.FullName build/tools/ } }
          } catch { Write-Host "release asset not available: $_" }
          if (-not $ok) { echo "BUILD_HEV=1" >> $env:GITHUB_ENV }

      - name: MSVC environment (fallback build)
        if: env.BUILD_HEV == '1'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build hev-socks5-tunnel from source (fallback)
        if: env.BUILD_HEV == '1'
        shell: cmd
        run: |
          choco install make -y --no-progress
          git clone --recursive --depth 1 --branch 2.20.0 https://github.com/heiher/hev-socks5-tunnel hev-src
          set "PATH=%PATH%;C:\Program Files\LLVM\bin;C:\Program Files\Git\usr\bin;C:\ProgramData\chocolatey\bin"
          make -C hev-src ARCH=x64
          copy /Y hev-src\bin\hev-socks5-tunnel.exe build\tools\

      - name: Get Wintun driver
        shell: pwsh
        run: |
          if (-not (Test-Path build/tools/wintun.dll)) {
            Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile wintun.zip
            Expand-Archive wintun.zip -DestinationPath wintun -Force
            Copy-Item wintun/wintun/bin/amd64/wintun.dll build/tools/
          }
          Copy-Item linux/assets/iran_ipv4.txt build/tools/
          Get-ChildItem build/tools

      - name: Fetch JSch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/input | Out-Null
          Invoke-WebRequest -Uri 'https://repo1.maven.org/maven2/com/github/mwiede/jsch/0.2.19/jsch-0.2.19.jar' -OutFile build/input/jsch.jar

      - name: Compile and package app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/classes | Out-Null
          $src = @(Get-ChildItem app/src/main/java/com/foxssh/vpn/core/*.java) + @(Get-ChildItem linux/src/com/foxssh/desktop/*.java)
          javac --release 11 -encoding UTF-8 -nowarn -cp build/input/jsch.jar -d build/classes $src.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item linux/assets/logo256.png build/classes/logo.png
          Copy-Item linux/assets/fonts build/classes/fonts -Recurse
          Copy-Item linux/assets/flags build/classes/flags -Recurse
          Copy-Item linux/assets/worldmap.png build/classes/
          Copy-Item linux/assets/tray-off.png, linux/assets/tray-on.png build/classes/
          Set-Content -Path build/classes/version.txt -Value $env:FOX_VERSION
          jar --create --file build/input/foxssh.jar --main-class com.foxssh.desktop.Gui -C build/classes .
          jpackage --type app-image --name FoxVPN --input build/input --main-jar foxssh.jar --main-class com.foxssh.desktop.Gui `
            --icon windows/foxvpn.ico --dest build/dist --app-version $env:FOX_VERSION `
            --java-options "-Xmx192m" --java-options "-Dfile.encoding=UTF-8" `
            --add-modules java.desktop,java.logging,java.naming,java.management,java.sql,jdk.crypto.ec,jdk.unsupported
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force -Path build/dist/FoxVPN/tools | Out-Null
          Copy-Item build/tools/* build/dist/FoxVPN/tools/
          Get-ChildItem build/dist/FoxVPN
          Compress-Archive -Path build/dist/FoxVPN -DestinationPath build/FoxVPN-portable.zip

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\FoxVPN.iss
          Get-ChildItem build/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: foxvpn-windows
          path: |
            build/FoxVPN-Setup-*.exe
            build/FoxVPN-portable.zip
