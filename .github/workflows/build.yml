name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
      - name: Fetch hev-socks5-tunnel
        run: git clone --recursive --depth 1 --branch 2.20.0 https://github.com/heiher/hev-socks5-tunnel app/src/main/jni/hev-socks5-tunnel
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/foxssh.jks
            echo "KEYSTORE_FILE=$RUNNER_TEMP/foxssh.jks" >> $GITHUB_ENV
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FoxSSH-apk
          path: app/build/outputs/apk/release/*.apk
